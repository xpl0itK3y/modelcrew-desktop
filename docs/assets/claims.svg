      <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3303;0.3333;0.4667;0.4697;1"/>
    </circle>
    <circle r="3.6" fill="#ff8fa3" opacity="0">
      <animateMotion dur="9.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4889;0.6222;1" calcMode="linear"><mpath xlink:href="#s3"/></animateMotion>
      <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4859;0.4889;0.6222;0.6252;1"/>
    </circle>
    <circle r="3.6" fill="#c9ced8" opacity="0">
      <animateMotion dur="9.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6444;0.7778;1" calcMode="linear"><mpath xlink:href="#s4"/></animateMotion>
      <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6414;0.6444;0.7778;0.7808;1"/>
    </circle>
    <circle r="3.6" fill="#4ade80" opacity="0">
      <animateMotion dur="9.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8000;0.9333;1" calcMode="linear"><mpath xlink:href="#s5"/></animateMotion>
      <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7970;0.8000;0.9333;0.9363;1"/>
    </circle>
  </g>
  <rect x="150.5" y="412.5" width="659" height="0" fill="none"/>
  <text class="m" x="480" y="430" font-size="11" text-anchor="middle" fill="#5c6472">each agent hears the refusal in its own protocol — an exit code, a JSON decision, a plugin error</text>
</svg>
