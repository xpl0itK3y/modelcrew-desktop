<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="Два агента просят один файл: первый получает его, второму отказано, и он берёт другой">
  <title>One file, one agent</title>
  <defs>
    <marker id="a_dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L7 4 L0 6.8 z" fill="#232833"/>
    </marker>
    <marker id="a_green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L7 4 L0 6.8 z" fill="#4ade80"/>
    </marker>
    <marker id="a_rose" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L7 4 L0 6.8 z" fill="#ff8fa3"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <rect x="0.5" y="0.5" width="959" height="451" rx="16" fill="#101216" stroke="#232833"/>
  <rect x="45.5" y="26.5" width="209" height="56" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="150" y="50" font-size="13" font-weight="600" text-anchor="middle" fill="#e8ebf2">Claude Code</text>
  <text x="150" y="68" font-size="10.5" text-anchor="middle" fill="#8b93a3">agent in panel 1</text>
  <line x1="150" y1="82" x2="150" y2="406" stroke="#1f242d" stroke-dasharray="4 5"/>
  <rect x="355.5" y="26.5" width="249" height="56" rx="12" fill="#16181d" stroke="#4ade80"/>
  <text x="480" y="50" font-size="13" font-weight="600" text-anchor="middle" fill="#e8ebf2">File claims</text>
  <text x="480" y="68" font-size="10.5" text-anchor="middle" fill="#8b93a3">the backend guard</text>
  <line x1="480" y1="82" x2="480" y2="406" stroke="#1f242d" stroke-dasharray="4 5"/>
  <rect x="705.5" y="26.5" width="209" height="56" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="810" y="50" font-size="13" font-weight="600" text-anchor="middle" fill="#e8ebf2">Codex</text>
  <text x="810" y="68" font-size="10.5" text-anchor="middle" fill="#8b93a3">agent in panel 2</text>
  <line x1="810" y1="82" x2="810" y2="406" stroke="#1f242d" stroke-dasharray="4 5"/>
  <path id="s0" d="M166 128 H464" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <text class="m" x="315" y="119" font-size="11" text-anchor="middle" fill="#8b93a3">claim  src/app.ts</text>
  <path id="s1" d="M464 172 H166" fill="none" stroke="#4ade80" stroke-width="1.6" marker-end="url(#a_green)"/>
  <text class="m" x="315" y="163" font-size="11" text-anchor="middle" fill="#4ade80">granted — it is yours</text>
  <path id="s2" d="M794 232 H496" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <text class="m" x="645" y="223" font-size="11" text-anchor="middle" fill="#8b93a3">claim  src/app.ts</text>
  <path id="s3" d="M496 276 H794" fill="none" stroke="#ff8fa3" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a_rose)"/>
  <text class="m" x="645" y="267" font-size="11" text-anchor="middle" fill="#ff8fa3">taken — refused</text>
  <path id="s4" d="M794 336 H496" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <text class="m" x="645" y="327" font-size="11" text-anchor="middle" fill="#8b93a3">claim  src/api.ts</text>
  <path id="s5" d="M496 380 H794" fill="none" stroke="#4ade80" stroke-width="1.6" marker-end="url(#a_green)"/>
  <text class="m" x="645" y="371" font-size="11" text-anchor="middle" fill="#4ade80">granted — it is yours</text>
