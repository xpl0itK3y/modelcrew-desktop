<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 384" width="960" height="384" role="img" aria-label="Путь сигнала: событие агента, проверка занятости панели, звук, баннер и счётчик в доке, возврат к нужной панели">
  <title>An agent out of sight still reaches you</title>
  <defs>
    <marker id="a_dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L7 4 L0 6.8 z" fill="#232833"/>
    </marker>
    <marker id="a_amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.2 L7 4 L0 6.8 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <rect x="0.5" y="0.5" width="959" height="383" rx="16" fill="#101216" stroke="#232833"/>
  <rect x="34.5" y="150.5" width="175" height="67" rx="12" fill="#16181d" stroke="#fbbf24"/>
  <text x="122" y="182" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8ebf2">Agent event</text>
  <text x="122" y="198" font-size="10" text-anchor="middle" fill="#8b93a3">finished · waiting · permission</text>
  <rect x="258.5" y="150.5" width="177" height="67" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="347" y="182" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8ebf2">Is the panel in use?</text>
  <text x="347" y="198" font-size="10" text-anchor="middle" fill="#8b93a3">seen · focused · window active</text>
  <rect x="258.5" y="274.5" width="177" height="51" rx="12" fill="#1b1e25" stroke="#1f242d"/>
  <text x="347" y="298" font-size="11.5" font-weight="600" text-anchor="middle" fill="#e8ebf2">Silence</text>
  <text x="347" y="314" font-size="10" text-anchor="middle" fill="#8b93a3">you are already there</text>
  <rect x="496.5" y="44.5" width="185" height="57" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="589" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#e8ebf2">Sound</text>
  <rect x="496.5" y="155.5" width="185" height="57" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="589" y="188" font-size="12" font-weight="600" text-anchor="middle" fill="#e8ebf2">System banner</text>
  <rect x="496.5" y="266.5" width="185" height="57" rx="12" fill="#16181d" stroke="#1f242d"/>
  <text x="589" y="300" font-size="12" font-weight="600" text-anchor="middle" fill="#e8ebf2">Dock badge</text>
  <text class="m" x="589" y="128" font-size="9.5" text-anchor="middle" fill="#5c6472">names the agent and the project</text>
  <text class="m" x="589" y="239" font-size="9.5" text-anchor="middle" fill="#5c6472">counts the waiting panels</text>
  <rect x="750.5" y="155.5" width="175" height="57" rx="12" fill="#16181d" stroke="#4ade80"/>
  <text x="838" y="182" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e8ebf2">One click</text>
  <text x="838" y="198" font-size="10" text-anchor="middle" fill="#8b93a3">opens that very panel</text>
