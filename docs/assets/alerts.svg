  <path id="a2" d="M436 176 C462 176 466 78 488 76" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#a_amber)"/>
  <path id="a3" d="M436 184 H488" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#a_amber)"/>
  <path id="a4" d="M436 192 C462 192 466 290 488 292" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#a_amber)"/>
  <path id="a5" d="M347 218 V266" fill="none" stroke="#1f242d" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#a_dim)"/>
  <path id="a6" d="M682 76 C712 76 720 174 742 178" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <path id="a7" d="M682 184 H742" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <path id="a8" d="M682 292 C712 292 720 194 742 190" fill="none" stroke="#232833" stroke-width="1.6" marker-end="url(#a_dim)"/>
  <path id="a9" d="M838 213 C838 352 120 356 120 244 V222" fill="none" stroke="#1f242d" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a_dim)"/>
  <text class="m" x="480" y="372" font-size="10" text-anchor="middle" fill="#5c6472">back to the agent that called — the right project, session and terminal</text>
  <text class="m" x="352" y="243" font-size="9.5" text-anchor="middle" fill="#5c6472">no</text>
  <text class="m" x="462" y="146" font-size="9.5" text-anchor="middle" fill="#5c6472">yes</text>
  <g class="flow">
    <circle r="3.4" fill="#fbbf24"><animateMotion dur="1.1s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a1"/></animateMotion></circle>
    <circle r="3.4" fill="#fbbf24"><animateMotion dur="1.3s" begin="0.9s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a2"/></animateMotion></circle>
    <circle r="3.4" fill="#fbbf24"><animateMotion dur="1.3s" begin="1.02s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a3"/></animateMotion></circle>
    <circle r="3.4" fill="#fbbf24"><animateMotion dur="1.3s" begin="1.1400000000000001s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a4"/></animateMotion></circle>
    <circle r="2.6" fill="#5c6472"><animateMotion dur="1.2s" begin="2.6s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a5"/></animateMotion></circle>
    <circle r="3.4" fill="#4ade80"><animateMotion dur="1.3s" begin="2.4s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a6"/></animateMotion></circle>
    <circle r="3.4" fill="#4ade80"><animateMotion dur="1.3s" begin="2.52s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a7"/></animateMotion></circle>
    <circle r="3.4" fill="#4ade80"><animateMotion dur="1.3s" begin="2.6399999999999997s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a8"/></animateMotion></circle>
    <circle r="2.8" fill="#4ade80"><animateMotion dur="3.0s" begin="3.8s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#a9"/></animateMotion></circle>
